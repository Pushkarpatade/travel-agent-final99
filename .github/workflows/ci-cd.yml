name: TravelPilot Multi-Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Backend Tests, Guardrails & Quality Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Safety Guardrail Tests
      run: |
        python -c "
        from backend.guardrails.safety_guardrails import safety_guardrails
        res = safety_guardrails.validate_trip_inputs({'destination': 'Tokyo', 'start_date': '2026-10-01', 'end_date': '2026-10-04', 'budget': 50000})
        assert res.is_safe, 'Safety guardrails failed on valid trip'
        print('✅ Safety Guardrails verified!')
        "

    - name: Verify Health Probes
      run: |
        python -c "
        from backend.main import app
        assert app.title == 'TravelPilot Multi-Agent API'
        print('✅ FastAPI App initialized!')
        "

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Typecheck and Build Frontend
      run: |
        cd frontend
        npm run build

  render-deploy-hook:
    name: Trigger Render Production Deploy
    needs: [test-and-verify, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Render via Webhook
      if: env.RENDER_DEPLOY_HOOK_URL != ''
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        curl -X POST "$RENDER_DEPLOY_HOOK_URL"
        echo "✅ Triggered Render Deployment!"
