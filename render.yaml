services:
  - type: web
    name: travelpilot-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: travelpilot-multiagent
      - key: JWT_SECRET
        generateValue: true
